<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Fuel Expenses">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)"/>

  <!-- Pump body -->
  <rect x="26" y="28" width="34" height="48" rx="6" fill="#fff"/>

  <!-- Display window -->
  <rect x="32" y="34" width="22" height="14" rx="3" fill="#0284c7" opacity="0.85"/>

  <!-- Gauge bars -->
  <rect x="35" y="38" width="10" height="2.5" rx="1.25" fill="#fff" opacity="0.9"/>
  <rect x="35" y="42.5" width="16" height="2.5" rx="1.25" fill="#fff" opacity="0.55"/>

  <!-- Nozzle hose -->
  <path
    d="M60 36 C72 36, 76 44, 76 52 C76 60, 72 64, 68 64"
    fill="none"
    stroke="#fff"
    stroke-width="5"
    stroke-linecap="round"
  />

  <!-- Nozzle tip -->
  <path
    d="M68 64 L62 70 L58 67 L64 61 Z"
    fill="#fff"
  />

  <!-- Base / stand -->
  <rect x="30" y="72" width="26" height="6" rx="2" fill="#fff"/>
  <rect x="34" y="78" width="18" height="4" rx="2" fill="#fff" opacity="0.9"/>
